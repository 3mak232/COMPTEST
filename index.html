 if(view=='jr'){const A=await g('accounts','code'),J=await g('journal_lines',null,'account_code,debit,credit'),m={};J.forEach(l=>{const r=m[l.account_code]||(m[l.account_code]={d:0,c:0});r.d+=+l.debit;r.c+=+l.credit});
  return `<h2>الحسابات</h2><div class="card np"><button onclick="act(async()=>{const n=await rpc('rebuild_journal',{});alert('تم ترحيل '+n+' قيد')})">ترحيل / تحديث قيود اليومية</button></div><div class="card"><b>ميزان المراجعة</b>${T(['الكود','الحساب','النوع','مدين','دائن'],A.map(a=>[a.code,e(a.name),a.type,fmt((m[a.code]||{}).d),fmt((m[a.code]||{}).c)]))}</div>`}
 if(view=='set'){const{data:s}=await sb.from('company_settings').select('*').single();return `<h2>الإعدادات</h2><div class="card np"><input id="sc" value="${e(s.company_name)}"><input id="sp" value="${e(s.invoice_prefix)}"><label><input type="checkbox" id="sn" ${s.negative_stock?'checked':''}> السماح بالمخزون السالب</label><label><input type="checkbox" id="st" ${s.tax_enabled?'checked':''}> تفعيل الضريبة</label><input id="sx" type="number" value="${s.tax_pct}" style="width:70px">%<button onclick="act(()=>upd('company_settings',1,{company_name:v('sc'),invoice_prefix:v('sp'),negative_stock:$('#sn').checked,tax_enabled:$('#st').checked,tax_pct:n('sx')}))">حفظ</button></div>`}}
async function R(q){
 if(!me){$('#app').innerHTML=`<main><div class="card" style="max-width:340px;margin:60px auto"><h2>تسجيل الدخول</h2><input id="lu" type="email" placeholder="البريد" style="width:95%"><input id="lp" type="password" placeholder="كلمة المرور" style="width:95%"><button onclick="login()" style="width:95%">دخول</button><button class="s" onclick="signup()" style="width:95%">إنشاء حساب (الأول = مدير)</button></div></main>`;return}
 if(!me.active){$('#app').innerHTML=`<main><div class="card"><h2>حسابك بانتظار التفعيل من المدير</h2><button onclick="logout()">خروج</button></div></main>`;return}
 if(!can(view))view='dash';await loadAll();const h=await V();
 $('#app').innerHTML=`<nav class="np"><b style="display:block;padding:8px">${e(me.name)}</b>${NAV.filter(x=>can(x[0])).map(x=>`<a class="${view==x[0]?'on':''}" onclick="view='${x[0]}';R()">${x[1]}</a>`).join('')}<a onclick="logout()">خروج</a></nav><main>${h}</main>`;
 if(q){const i=$('#q');i.focus();i.setSelectionRange(99,99)}}
function addL(k){const p=by(C.products,v('il')),pr=n('ir')||(k=='p'?p.purchase_price:p.sale_price);if(n('iq')<=0)return alert('الكمية غير صحيحة');cart[k].push({product_id:p.id,qty:n('iq'),price:+pr,discount:n('id')});R()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:v('lu'),password:v('lp')});if(error)return alert(error.message);await boot()}
async function signup(){const{error}=await sb.auth.signUp({email:v('lu'),password:v('lp')});if(error)return alert(error.message);alert('تم الإنشاء. سجّل الدخول (وأكّد البريد إن كان التأكيد مفعّلًا).')}
async function logout(){await sb.auth.signOut();me=null;R()}
async function boot(){const{data:{user}}=await sb.auth.getUser();me=null;if(user){const{data}=await sb.from('profiles').select('*').eq('id',user.id).single();me=data}R()}
async function runTests(){if(!confirm('سينشئ بيانات تجريبية حقيقية. متابعة؟'))return;const r=[],ck=(t,a,b)=>r.push([t,a,b,+a===+b]);
 try{await loadAll();const wh=C.warehouses[0].id,ac=C.accts[0].id,tag='TEST-'+Date.now(),
 stockOf=async p=>{const{data}=await sb.from('stock_balances').select('qty').eq('product_id',p);return data.reduce((a,x)=>a+ +x.qty,0)},
 bal=async c=>(await sb.from('customer_balances').select('balance').eq('id',c).single()).data.balance,
 cash=async()=>(await sb.from('cash_accounts').select('balance').eq('id',ac).single()).data.balance;
 const p=await ins('products',{name:'iPhone Case',code:tag,purchase_price:200,sale_price:300,avg_cost:200,min_stock:3}),c=await ins('customers',{name:'Ahmed '+tag}),s=await ins('suppliers',{name:'مورد '+tag});
 await rpc('approve_stocktake',{p_warehouse:wh,p_items:[{product_id:p.id,actual:10}]});ck('المخزون الافتتاحي',await stockOf(p.id),10);
 await rpc('create_sale',{p_customer:c.id,p_warehouse:wh,p_items:[{product_id:p.id,qty:2,price:300,discount:0}],p_paid:0,p_method:'credit'});ck('المخزون بعد البيع',await stockOf(p.id),8);ck('رصيد العميل بعد البيع',await bal(c.id),600);
 await rpc('record_payment',{p_kind:'receipt',p_party:c.id,p_amount:600,p_account:ac});ck('رصيد العميل بعد الدفع',await bal(c.id),0);
 await rpc('create_purchase',{p_supplier:s.id,p_warehouse:wh,p_items:[{product_id:p.id,qty:5,price:200,discount:0}],p_paid:0,p_method:'credit'});ck('المخزون بعد الشراء',await stockOf(p.id),13);
 const b0=+await cash();await rpc('create_expense',{p_category:'أخرى',p_desc:tag,p_amount:500,p_account:ac});ck('انخفاض الخزينة بالمصروف',b0-await cash(),500);
 const{count}=await sb.from('audit_logs').select('*',{count:'exact',head:true});r.push(['عدد سجلات Audit',count,'> 0',count>0])}catch(x){r.push(['خطأ: '+(x.message||x),'','',false])}
 tests=r;R()}
async function loadRet(){const s=v('rk')=='s',id=v('ri');const{data}=await sb.from(s?'sales_invoice_items':'purchase_invoice_items').select('product_id,qty').eq('invoice_id',id);RT={s,id,items:data||[]};R()}
function saveRet(){act(async()=>{const it=RT.items.map((x,i)=>({product_id:x.product_id,qty:+$('#rq'+i).value||0})).filter(x=>x.qty>0);await rpc(RT.s?'create_sales_return':'create_purchase_return',{p_invoice:RT.id,p_items:it});RT=null})}
async function showStmt(){try{const cu=v('sk')=='c',id=v('sp'),a=v('sa')||'0000-01-01',b=v('sb2')||'9999-12-31',P_=by(cu?C.customers:C.suppliers,id),rows=await rpc(cu?'customer_statement':'supplier_statement',{p_party:id,p_to:b}),sg=cu?1:-1;
 let bal=+P_.opening_balance,tot=[0,0];const op=[];rows.forEach(r=>{if(r.d<a)bal+=sg*(r.debit-r.credit)});const open=bal,body=rows.filter(r=>r.d>=a).map(r=>{bal+=sg*(r.debit-r.credit);tot[0]+=+r.debit;tot[1]+=+r.credit;return[r.d,e(r.doc),r.descr,fmt(r.debit),fmt(r.credit),fmt(bal)]});
 st=`<h3>${e(P_.name)}</h3><p>الرصيد الافتتاحي للفترة: <b>${fmt(open)}</b></p>`+T(['التاريخ','المستند','البيان','مدين','دائن','الرصيد'],body)+`<p>إجمالي مدين: ${fmt(tot[0])} | إجمالي دائن: ${fmt(tot[1])} | الرصيد الختامي: <b>${fmt(bal)}</b></p>`;R()}catch(x){alert(x.message)}}
sb.auth.getSession().then(boot);
</script></body></html>
